<!doctype html>
<html lang="en">
<meta charset="utf-8">

<style>
/* Layout: a 1280x720 stage scaled to fit, player bar under it. Single dark theme, "tunnel" teal. */
:root{
  --bg:#071014; --ink:#0C1A20; --panel:#10232A; --ink2:#163038; --ink3:#24444E; --paper:#E8F3F1; --mute:#93ADA9;
  --acc:#3FD0B0; --warn:#F2B84B; --red:#FF6F6F; --blue:#7CB4FF;
  --ui:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif; --mono:ui-monospace,"Cascadia Code",Consolas,"Courier New",monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--paper);font-family:var(--ui);overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
#player{position:relative;height:100%;display:flex;flex-direction:column;gap:8px;padding-block:8px;box-sizing:border-box}
#wrap{flex:1;position:relative;overflow:hidden;min-height:0}
#stage{position:absolute;left:50%;top:50%;width:1280px;height:720px;transform-origin:center center;overflow:hidden;border-radius:10px;
  background:radial-gradient(ellipse at 28% 18%,#10303A 0%,#0A1A20 58%,#061014 100%);box-shadow:0 0 0 1px var(--ink3)}
#hud{flex:0 0 auto;display:flex;align-items:center;gap:12px;font:13px var(--ui);color:var(--mute);min-width:0}
#pp{width:36px;height:30px;border-radius:6px;border:1px solid var(--ink3);background:var(--ink2);color:var(--paper);font:14px var(--ui);cursor:pointer}
#pp:focus-visible,#prog:focus-visible,#mu:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
#sname{color:var(--paper);font-weight:600;white-space:nowrap;min-width:0;overflow:hidden;text-overflow:ellipsis;max-width:260px}
#prog{position:relative;flex:1;height:14px;cursor:pointer;min-width:60px}
#prog .segs{position:absolute;inset:4px 0;display:flex;gap:2px}
#prog .segs i{display:block;height:100%;background:var(--ink3);border-radius:2px}
#prog .fill{position:absolute;left:0;top:4px;bottom:4px;background:var(--acc);border-radius:2px;pointer-events:none;opacity:.9}
#time{font:12px var(--mono);white-space:nowrap}
.hint{font:12px var(--ui);white-space:nowrap}
#mu{background:none;border:1px solid var(--ink3);color:var(--paper);border-radius:6px;font:600 12px var(--ui);padding:4px 8px;cursor:pointer}
@media (max-width:700px){.hint{display:none}#sname{max-width:120px}}
#startov{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:rgba(4,12,15,.74);cursor:pointer;font:600 15px var(--ui);color:var(--paper)}
#startov b{display:flex;align-items:center;justify-content:center;width:96px;height:96px;border-radius:50%;background:var(--acc);color:#062019;font-size:38px;padding-left:6px;box-shadow:0 10px 40px rgba(0,0,0,.45)}
#startov.off{display:none}
#fs{background:none;border:1px solid var(--ink3);color:var(--paper);border-radius:6px;font:600 12px var(--ui);padding:4px 8px;cursor:pointer;white-space:nowrap}
#fsx{display:none;position:fixed;top:calc(14px + env(safe-area-inset-top,0px));right:calc(14px + env(safe-area-inset-right,0px));z-index:60;align-items:center;gap:8px;padding:10px 16px;border-radius:999px;border:1px solid rgba(255,255,255,.25);background:rgba(0,0,0,.62);color:#fff;font:700 14px var(--ui);cursor:pointer;backdrop-filter:blur(6px)}
body.isfs #fsx{display:inline-flex}


/* stage pieces */
.A{position:absolute}
.stitle{left:28px;top:20px;display:flex;gap:10px;align-items:center;font:600 15px var(--ui);color:var(--paper);z-index:20}
.stitle b{font:12px var(--mono);color:#062019;background:var(--acc);padding:2px 7px;border-radius:4px}
.exb{right:24px;top:20px;font:600 11px var(--ui);letter-spacing:.12em;color:var(--warn);border:1px solid var(--warn);padding:3px 8px;border-radius:4px;z-index:20}
.card{background:var(--panel);border:1px solid var(--ink3);border-radius:10px;padding:14px 16px;box-sizing:border-box}
.lbl{font:600 11px var(--ui);letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.mono{font-family:var(--mono)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:5px;font:12.5px var(--mono);background:#0006;border:1px solid var(--ink3);color:var(--paper);white-space:nowrap}
.chip.on{background:var(--acc);color:#062019;border-color:var(--acc)}
.chip.w{border-color:var(--warn);color:var(--warn)}
.cap{font:16px/1.45 var(--ui);color:var(--mute)}
.code{font:14px/1.65 var(--mono);color:var(--paper);white-space:pre}
.code .k{color:var(--acc)} .code .s{color:#b7e0ff} .code .c{color:#6f8a86} .code .n{color:var(--warn)}
.grid-bg{inset:0;background-image:linear-gradient(#ffffff07 1px,transparent 1px),linear-gradient(90deg,#ffffff07 1px,transparent 1px);background-size:40px 40px}
.pk{width:12px;height:12px;border-radius:50%;background:var(--acc);box-shadow:0 0 16px var(--acc);margin:-6px 0 0 -6px;z-index:9}
.win{background:#0E1E24;border:1px solid var(--ink3);border-radius:10px;overflow:hidden;box-shadow:0 22px 60px #0009}
.win .tb{display:flex;align-items:center;gap:8px;height:36px;padding:0 12px;background:#0A171C;border-bottom:1px solid var(--ink3);font:13px var(--ui);color:var(--mute)}
.win .tb i{width:10px;height:10px;border-radius:50%;background:var(--ink3);display:inline-block}
.win .url{flex:1;margin-left:8px;background:#0006;border:1px solid var(--ink3);border-radius:6px;padding:3px 10px;font:13px var(--mono);color:var(--paper);white-space:nowrap;overflow:hidden}
.ok{color:var(--acc)} .no{color:var(--red)}
.strike{position:relative}
.strike::after{content:"";position:absolute;left:-4px;right:-4px;top:52%;height:2px;background:var(--red);transform-origin:left;transform:scaleX(var(--k,0))}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>

<style id="mai-load-css">#mai-load{position:fixed;inset:0;z-index:2147483000;display:grid;place-items:center;background:var(--mai-load-bg,#10131B);transition:opacity .35s ease}
#mai-load.off{opacity:0;pointer-events:none}#mai-load i{width:42px;height:42px;border-radius:50%;border:3px solid rgba(255,255,255,.18);border-top-color:rgba(255,255,255,.85);animation:mai-spin .8s linear infinite}
@keyframes mai-spin{to{transform:rotate(360deg)}}</style>
<div id="mai-load" aria-label="Loading"><i></i></div>
<script>(() => { /* hide the loading screen as soon as the voice is really playing */
  const ov = document.getElementById('mai-load');
  const hide = () => ov.classList.add('off');
  if (/[?&](t=|autoplay=0)/.test(location.search)) { hide(); return; }
  const watch = a => { const ok = () => { if (a.currentTime > 0.02 && !a.paused) hide(); }; a.addEventListener('timeupdate', ok); a.addEventListener('playing', ok); };
  const find = () => { const a = document.querySelector('audio'); if (a) watch(a); else setTimeout(find, 50); };
  find(); setTimeout(hide, 9000);
  window.__maiLoaderShow = () => ov.classList.remove('off');
})();</script>
<div id="player">

<script>
(() => {
'use strict';
/* ---------- helpers ---------- */
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const ease = x => x < .5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2;
const es = (t, a, b) => ease(seg(t, a, b));
const lerp = (a, b, x) => a + (b - a) * x;
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function A(p, cls, x, y, w, h, html) {
  const e = document.createElement('div'); e.className = 'A ' + (cls || '');
  if (x != null) e.style.left = x + 'px'; if (y != null) e.style.top = y + 'px';
  if (w != null) e.style.width = w + 'px'; if (h != null) e.style.height = h + 'px';
  if (html != null) e.innerHTML = html; p.appendChild(e); return e;
}
const op = (e, v) => { e.style.opacity = v; e.style.visibility = v <= .001 ? 'hidden' : 'visible'; };
const fadeUp = (e, v, d = 14) => { op(e, v); e.style.transform = `translateY(${(1 - v) * d}px)`; };
const typed = (txt, lt, t0, cps = 30) => txt.slice(0, Math.max(0, Math.floor((lt - t0) * cps)));
const LOGO = (s = 64) => `<svg viewBox="0 0 64 64" width="${s}" height="${s}" aria-hidden="true"><path d="M32 4 56 13v17c0 15-10 26-24 30C18 56 8 45 8 30V13z" fill="#10303A" stroke="#3FD0B0" stroke-width="3"/><path d="M18 34c6-10 22-10 28 0" fill="none" stroke="#3FD0B0" stroke-width="3" stroke-linecap="round"/><path d="M24 40c4-5 12-5 16 0" fill="none" stroke="#3FD0B0" stroke-width="3" stroke-linecap="round"/><circle cx="32" cy="45" r="3" fill="#3FD0B0"/></svg>`;
const AI = `<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1v4M8 11v4M1 8h4M11 8h4M3 3l2.5 2.5M10.5 10.5 13 13M13 3l-2.5 2.5M5.5 10.5 3 13" stroke="#3FD0B0" stroke-width="1.6" stroke-linecap="round"/></svg>`;
const SC = [];
/* Product picture for the example shop: headphones on a soft stage, with a country banner. */
const PRODUCT = (banner, hl) => `<svg viewBox="0 0 400 150" width="100%" height="150" style="display:block;border-radius:8px">
  <defs><linearGradient id="pg${hl ? 1 : 0}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${hl ? '#1d4a48' : '#1f3540'}"/><stop offset="1" stop-color="#0f2228"/></linearGradient></defs>
  <rect width="400" height="150" fill="url(#pg${hl ? 1 : 0})"/>
  <ellipse cx="200" cy="132" rx="96" ry="9" fill="#000" opacity=".35"/>
  <path d="M138 104 C138 40 262 40 262 104" fill="none" stroke="#E8F3F1" stroke-width="11" stroke-linecap="round"/>
  <path d="M144 100 C146 52 254 52 256 100" fill="none" stroke="#93ADA9" stroke-width="3" opacity=".6"/>
  <rect x="118" y="88" width="38" height="50" rx="14" fill="#E8F3F1"/><rect x="126" y="96" width="22" height="34" rx="9" fill="${hl ? '#3FD0B0' : '#7CB4FF'}"/>
  <rect x="244" y="88" width="38" height="50" rx="14" fill="#E8F3F1"/><rect x="252" y="96" width="22" height="34" rx="9" fill="${hl ? '#3FD0B0' : '#7CB4FF'}"/>
  <g transform="translate(300 16)"><rect width="88" height="28" rx="6" fill="${hl ? '#3FD0B0' : '#F2B84B'}"/><text x="44" y="19" text-anchor="middle" font-family="Segoe UI,Arial" font-size="13" font-weight="800" fill="#062019">${banner}</text></g>
  <g fill="#E8F3F1" opacity=".5"><circle cx="40" cy="30" r="2"/><circle cx="66" cy="112" r="1.6"/><circle cx="352" cy="118" r="2"/></g></svg>`;
const shop = (cty, lang, price, ship, hl, banner = '') => `<div class="tb"><i></i><i></i><i></i><span class="url">https://shop.example/item</span></div>
  <div style="padding:18px 20px;display:flex;flex-direction:column;gap:12px">
    <div style="display:flex;justify-content:space-between"><b style="font:700 18px var(--ui)">Example shop</b><span class="chip ${hl ? 'on' : ''}">seen from ${cty}</span></div>
    ${PRODUCT(banner, hl)}
    <div style="font:700 26px var(--ui)">${price}</div><div class="cap">${ship}</div><div class="mono" style="font-size:13px;color:var(--mute)">lang: ${lang}</div></div>`;

/* Prompt bar used by every scene: everything starts from what the user writes. */
function promptBar(r, y = 58) {
  const bar = A(r, '', 40, y, 1200, 50, `<div style="display:flex;align-items:center;gap:12px;height:50px;padding:0 14px;background:#163038;border:1px solid #2f5a64;border-radius:25px;box-shadow:0 6px 20px #0006">
    <span style="font:700 12px var(--ui);color:#062019;background:var(--paper);border-radius:12px;padding:3px 9px">You write to Claude</span>
    <span class="pt" style="flex:1;font:18px var(--ui);color:var(--paper);white-space:nowrap;overflow:hidden"></span>
    <span class="snd" style="width:30px;height:30px;border-radius:50%;background:#24444E;display:grid;place-items:center;color:#fff;font:700 15px var(--ui)">↑</span></div>`);
  return { bar, pt: bar.querySelector('.pt'), snd: bar.querySelector('.snd') };
}
function typePrompts(b, lt, list, cps = 28) {
  let cur = list[0]; for (const q of list) if (lt >= q[0]) cur = q;
  const end = cur[0] + cur[1].length / cps;
  b.pt.textContent = typed(cur[1], lt, cur[0], cps);
  b.snd.style.background = lt > end && lt < end + .5 ? '#3FD0B0' : '#24444E';
  return end;
}
function aiPanel(r, x, y, w, h, steps) {
  const side = A(r, 'card', x, y, w, h, `<div style="display:flex;gap:8px;align-items:center;margin-bottom:8px">${AI}<b>Claude at work</b><span class="cap" style="font-size:13px;margin-left:auto">tools it calls</span></div>` +
    steps.map(([, a, b]) => `<div class="as" style="display:grid;grid-template-columns:22px 1fr;gap:6px;margin:9px 0;font:15px/1.35 var(--ui)"><span class="ic" style="color:var(--warn)">○</span><div>${a}${b ? `<div class="mono" style="font-size:12.5px;color:var(--acc)">${b}</div>` : ''}</div></div>`).join(''));
  return { side, as: [...side.querySelectorAll('.as')], steps };
}
function aiUpdate(p, lt, endT = 1e9) {
  p.as.forEach((e, i) => { const t = p.steps[i][0], nt = i + 1 < p.steps.length ? p.steps[i + 1][0] : endT; op(e, lt >= t ? 1 : .3); const ic = e.querySelector('.ic'); ic.textContent = lt >= nt ? '✓' : lt >= t ? '◐' : '○'; ic.style.color = lt >= nt ? 'var(--acc)' : 'var(--warn)'; });
}
function cotLine(r, y = 612) {
  const c = A(r, '', 40, y, 1200, 38, `<div style="display:flex;align-items:center;gap:10px;height:38px;padding:0 14px;background:#061014e6;border-top:2px solid var(--acc);border-radius:6px;font:14px var(--mono)">${AI}<span style="color:var(--acc);font-weight:700">Claude</span><span class="cx" style="flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis"></span><span class="cap" style="font-size:12px">reasoning · example</span></div>`);
  return c.querySelector('.cx');
}
const cotAt = (cx, lt, list) => { let ph = ''; for (const [t, p] of list) if (lt >= t) ph = p; cx.textContent = ph; };

/* 1. Intro */
SC.push({ title: 'Claude VPN MCP', dur: 10, ex: false, build(r) {
  A(r, 'grid-bg');
  const logo = A(r, '', 90, 120, 80, 80, LOGO(80));
  const chip = A(r, '', 90, 222, 600, 34, '<span class="chip on" style="font:700 14px var(--ui);padding:5px 12px">Free · built on Tor · MCP connector for Claude</span>');
  const t = A(r, '', 86, 270, 640, 90, '<div style="font:800 66px var(--ui);letter-spacing:2px">Claude VPN MCP</div>');
  const s1 = A(r, '', 90, 362, 560, 90, '<div style="font:700 30px/1.3 var(--ui)">Write where you want to be.<br><span style="color:var(--acc)">Claude does the rest.</span></div>');
  const by = A(r, '', 90, 470, 400, 30, '<div class="cap">by Monili VLR</div>');
  const chat = A(r, 'win', 700, 140, 520, 350, `<div class="tb"><span>Claude</span></div>
    <div style="padding:18px;display:flex;flex-direction:column;gap:14px">
      <div style="align-self:flex-end;max-width:380px;background:#24444E;border-radius:14px 14px 3px 14px;padding:11px 14px;font:17px/1.4 var(--ui)"><span class="ty"></span></div>
      <div class="cl mono" style="font-size:13px;color:var(--acc);opacity:0">vpn_activate("California") ✓ Tor route ready</div>
      <div class="an" style="max-width:440px;background:#10232A;border:1px solid var(--ink3);border-radius:14px 14px 14px 3px;padding:12px 14px;font:16px/1.45 var(--ui);opacity:0">Done. Your browser now goes online from <b style="color:var(--acc)">Los Angeles, California</b>, through Tor. What should I open?</div>
      <div class="stt" style="display:flex;gap:8px;flex-wrap:wrap;opacity:0"><span class="chip on">exit · Los Angeles, CA</span><span class="chip">via Tor</span><span class="chip">verified twice</span></div>
      <div class="cap" style="font-size:12.5px">Example conversation</div></div>`);
  return { logo, chip, t, s1, by, chat, ty: chat.querySelector('.ty'), an: chat.querySelector('.an'), cl: chat.querySelector('.cl'), stt: chat.querySelector('.stt') };
}, update(c, lt) {
  fadeUp(c.logo, es(lt, 0, .8)); fadeUp(c.chip, es(lt, .3, 1)); c.t.style.clipPath = `inset(0 ${100 - 100 * es(lt, .5, 1.7)}% 0 0)`;
  fadeUp(c.s1, es(lt, 1.6, 2.4)); fadeUp(c.by, es(lt, 2.6, 3.2)); fadeUp(c.chat, es(lt, .8, 1.6));
  c.ty.textContent = typed('Activate my location in California.', lt, 1.8, 24);
  op(c.cl, es(lt, 3.8, 4.3)); fadeUp(c.an, es(lt, 5, 5.7)); fadeUp(c.stt, es(lt, 6, 6.6));
} });

/* 2. The need */
SC.push({ title: 'See a page as people there see it', dur: 12, ex: true, build(r) {
  const b = promptBar(r);
  const a = A(r, 'win', 60, 130, 440, 390, shop('Spain', 'es', '€ 24,90', 'Envío gratis en 48 h', false, 'NOVEDAD'));
  const w = A(r, 'win', 530, 130, 440, 390, shop('Italy', 'it', '€ 22,50', 'Spedizione gratuita in 72 h', true, 'SALDI'));
  const q = A(r, 'card', 1000, 150, 230, 280, `<div style="display:flex;gap:8px;align-items:center">${AI}<b>Claude</b></div><p class="cap" style="font-size:15px;margin:10px 0 0">Prices, language and offers can change with the country.</p><p class="cap" style="font-size:15px;margin:10px 0 0">To see them, Claude looks <b style="color:var(--paper)">from there</b>.</p>
    <svg viewBox="0 0 200 92" width="198" height="92" style="margin-top:12px"><g font-family="Segoe UI,Arial" font-size="12" font-weight="700">
      <path d="M30 70 C70 70 70 22 100 22 C130 22 130 70 170 70" fill="none" stroke="#3FD0B0" stroke-width="2" stroke-dasharray="5 5"/>
      <circle cx="30" cy="70" r="7" fill="#F2B84B"/><text x="30" y="90" text-anchor="middle" fill="#93ADA9">ES</text>
      <rect x="72" y="8" width="56" height="26" rx="7" fill="#163038" stroke="#3FD0B0"/><text x="100" y="26" text-anchor="middle" fill="#E8F3F1">Claude</text>
      <circle cx="170" cy="70" r="7" fill="#3FD0B0"/><text x="170" y="90" text-anchor="middle" fill="#E8F3F1">IT</text></g></svg>`);
  const cap = A(r, '', 60, 548, 1160, 60, '<div class="cap">Example pages. Useful for localisation, regional pages and what customers in each country really see.</div>');
  return { b, a, w, q, cap };
}, update(c, lt) { typePrompts(c.b, lt, [[.3, 'Show me this shop page as people in Italy see it.']]); fadeUp(c.a, es(lt, 2.2, 3)); fadeUp(c.w, es(lt, 3.2, 4)); fadeUp(c.q, es(lt, 4.6, 5.4)); fadeUp(c.cap, es(lt, 6, 6.8)); } });

/* 3. Activate a place with a prompt */
SC.push({ title: 'Activate a place with a prompt', dur: 18, ex: true, build(r) {
  const b = promptBar(r);
  const map = A(r, 'card', 40, 128, 640, 460, `<div class="lbl" style="margin-bottom:6px">Exit location</div><svg viewBox="0 0 1474 1067" width="606" height="410" preserveAspectRatio="xMidYMid meet" style="display:block">
    <image href="media/387f286ac3d2.webp" x="0" y="0" width="1474" height="1067"/>
    <image class="st" href="media/28603355df7a.webp" x="0" y="0" width="1474" height="1067" opacity="0"/>
    <g class="pin" opacity="0"><circle cx="238" cy="552" r="58" fill="#3FD0B0" fill-opacity=".22"/><circle cx="238" cy="552" r="22" fill="#3FD0B0" stroke="#062019" stroke-width="5"/>
    <rect x="292" y="492" width="560" height="118" rx="18" fill="#061014" fill-opacity=".82" stroke="#3FD0B0" stroke-width="3"/>
    <text x="322" y="545" fill="#E8F3F1" font-family="Segoe UI,Arial" font-size="46" font-weight="700">Los Angeles, California</text>

  return { term, t: term.querySelector('.t'), cl, u: cl.querySelector('.u'), cn: cl.querySelector('.cn'), ok2: cl.querySelector('.ok2'), big };
}, update(c, lt) {

  const L = [['$ pip install -r requirements.txt', .6], ['Installing mcp, httpx, playwright...', 2], ['✓ Done', 3.4], ['First place: Tor and the browser engine download by themselves.', 4.4], ['✓ Tor checked against its published checksum', 6], ['✓ Ready', 6.8]];
  c.t.innerHTML = L.map(([s, t]) => lt < t ? '' : `<div class="${s.startsWith('$') || s.startsWith('✓') ? 'ok' : ''}">${esc(typed(s, lt, t, 46))}</div>`).join('');
  fadeUp(c.cl, es(lt, 7.4, 8.2)); c.u.textContent = typed('"claude-vpn": { "command": "python", "args": ["server.py"] }', lt, 8.2, 40); c.cn.classList.toggle('on', lt > 9.8); fadeUp(c.ok2, es(lt, 10, 10.6));
  fadeUp(c.big, es(lt, 10.4, 11.2));
} });

/* 10. Limits */
SC.push({ title: 'Limits, honestly', dur: 12, ex: false, build(r) {

  const L = A(r, '', 60, 140, 640, 440, `<div class="lbl" style="margin-bottom:14px">Current limits</div>` + lim.map(t => `<div class="li" style="font:600 22px/1.35 var(--ui);margin:0 0 20px;padding-left:18px;border-left:3px solid var(--warn)">${t}</div>`).join(''));
  const add = ['Up to 3 places at once', 'One browser per place', 'Ready until you turn it off', 'Free, no account'];
  const W = A(r, 'card', 740, 380, 480, 110, `<div style="display:flex;gap:14px;align-items:flex-start"><svg viewBox="0 0 28 28" width="34" height="34" style="flex:none"><path d="M14 3 26 24H2z" fill="none" stroke="#F2B84B" stroke-width="2.2" stroke-linejoin="round"/><path d="M14 11v6" stroke="#F2B84B" stroke-width="2.4" stroke-linecap="round"/><circle cx="14" cy="20.5" r="1.4" fill="#F2B84B"/></svg><div><b>Keep personal accounts out</b><p class="cap" style="margin:6px 0 0;font-size:15px">Never sign in or type passwords in this browser.</p></div></div>`);
  const R = A(r, 'card', 740, 150, 480, 210, `<div style="font:700 23px var(--ui);margin-bottom:14px">Good to know:</div><div style="display:flex;flex-wrap:wrap;gap:10px">${add.map(t => `<span class="chip ad" style="font:15px var(--ui);padding:6px 12px">${t}</span>`).join('')}</div>`);
  return { b, li: [...L.querySelectorAll('.li')], R, W, ad: [...R.querySelectorAll('.ad')] };
}, update(c, lt) { typePrompts(c.b, lt, [[.3, 'What are the limits?']]); c.li.forEach((e, i) => fadeUp(e, es(lt, 1.4 + i * .7, 2.1 + i * .7))); fadeUp(c.R, es(lt, 4.6, 5.4)); c.ad.forEach((e, i) => op(e, es(lt, 5.4 + i * .35, 5.8 + i * .35))); fadeUp(c.W, es(lt, 7.8, 8.6)); } });

/* ---------- player ---------- */
const stage = document.getElementById('stage'), wrap = document.getElementById('wrap');
const starts = []; let TOTAL = 0; for (const s of SC) { starts.push(TOTAL); TOTAL += s.dur; }
document.querySelector('#prog .segs').innerHTML = SC.map(s => `<i style="flex:${s.dur}" title="${esc(s.title)}"></i>`).join('');
const fill = document.querySelector('#prog .fill'), pp = document.getElementById('pp'), sname = document.getElementById('sname'), tim = document.getElementById('time');
let t = 0, playing = false, started = false, last = performance.now(), cur = -1, ctx = null;
const fmt = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
function fit() { const s = Math.min(wrap.clientWidth / 1280, wrap.clientHeight / 720); stage.style.transform = `translate(-50%,-50%) scale(${s})`; }
addEventListener('resize', fit); fit();
function enter(i) {
  cur = i; stage.innerHTML = '';
  const root = A(stage, '', 0, 0, 1280, 720), s = SC[i];
  A(root, 'stitle', null, null, null, null, `<b>${String(i + 1).padStart(2, '0')}/${SC.length}</b>${esc(s.title)}`);
  if (s.ex) A(root, 'exb', null, null, null, null, 'EXAMPLE DATA');
  ctx = s.build(root); sname.textContent = s.title;
}
function render() {
  let i = 0; while (i < SC.length - 1 && t >= starts[i + 1]) i++;
  if (i !== cur) enter(i);
  SC[i].update(ctx, !started && t === 0 ? 3.6 : Math.min(t - starts[i], SC[i].dur));
  fill.style.width = (t / TOTAL * 100) + '%'; tim.textContent = `${fmt(t)} / ${fmt(TOTAL)}`;
  pp.textContent = playing ? '❚❚' : '▶'; pp.setAttribute('aria-label', playing ? 'Pause' : 'Play');
}
const vo = document.getElementById('vo'), so = document.getElementById('startov'), mu = document.getElementById('mu');
let hold = 0;
function loop(now) {
  const dt = Math.min(.1, (now - last) / 1000); last = now;
  if (playing) {
    if (!vo.paused && !vo.muted && vo.readyState >= 2 && Math.abs(vo.currentTime - t) < .5) t = vo.currentTime; else if (vo.readyState >= 3 || vo.muted || (hold += dt) > 6) t += dt; /* wait for the voice to be ready, at most 6 s */
    if (Math.abs(vo.currentTime - t) > .25 && vo.readyState >= 1) vo.currentTime = t;
    if (vo.paused && t < TOTAL - .2) vo.play().catch(() => {});
    if (t >= TOTAL) { t = TOTAL - .001; playing = false; }
  }
  if (!playing && !vo.paused) vo.pause();
  render(); requestAnimationFrame(loop);
}
const toggle = () => { started = true; so.classList.add('off'); if (!playing && t >= TOTAL - .01) t = 0; playing = !playing; if (playing) { vo.currentTime = t; vo.play().catch(() => {}); } else vo.pause(); };
const setMute = () => { vo.muted = !vo.muted; mu.textContent = vo.muted ? 'Voice off' : 'Voice on'; };
const seek = x => { started = true; t = clamp(x, 0, TOTAL - .001); cur = -1; if (vo.readyState >= 1) vo.currentTime = t; };
so.onclick = toggle; so.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); } };
mu.onclick = setMute; pp.onclick = toggle;
const qt = /[?&]t=([\d.]+)/.exec(location.search); if (qt) { started = true; so.classList.add('off'); t = Math.min(+qt[1], TOTAL - .001); }

/* start at once: with voice when the browser allows it, otherwise silent until the first click or key */
function start() {
  started = true; so.classList.add('off');
  if (playing) return;
  if (t >= TOTAL - .01) t = 0;
  playing = true; vo.currentTime = t; vo.muted = false;
  vo.play().catch(() => {
    vo.muted = true; mu.textContent = 'Voice off · click to hear'; vo.play().catch(() => {});
    const on = () => { unmute(); removeEventListener('pointerdown', on, true); removeEventListener('keydown', on, true); };
    addEventListener('pointerdown', on, true); addEventListener('keydown', on, true);
  });
}
function unmute() { if (!vo.muted) return; vo.muted = false; mu.textContent = 'Voice on'; vo.currentTime = t; if (playing) vo.play().catch(() => {}); }
if (!/[?&](t=|autoplay=0)/.test(location.search)) start();
const prog = document.getElementById('prog');
prog.addEventListener('click', e => { const b = prog.getBoundingClientRect(); seek((e.clientX - b.left) / b.width * TOTAL); });
async function full() { try { if (document.fullscreenElement) await document.exitFullscreen(); else await document.documentElement.requestFullscreen(); } catch (e) { /* not available */ } setTimeout(fit, 120); }
document.addEventListener('fullscreenchange', () => { const on = !!document.fullscreenElement; document.body.classList.toggle('isfs', on); fsb.textContent = on ? '⤡ Exit full screen' : '⛶ Full screen'; setTimeout(fit, 60); });
const fsb = document.getElementById('fs'); fsb.onclick = full; document.getElementById('fsx').onclick = full;
addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); toggle(); }
  else if (e.key === 'f' || e.key === 'F') { e.preventDefault(); full(); }
  else if (e.key === 'm' || e.key === 'M') setMute();
  else if (e.key === 'ArrowRight') seek(t + 5); else if (e.key === 'ArrowLeft') seek(t - 5);
});
requestAnimationFrame(loop);
window.__gm = { start, unmute, seek: x => { seek(x); render(); }, pause: () => { playing = false; so.classList.add('off'); }, starts, TOTAL, scenes: SC.map(s => s.title) };
})();
</script>
